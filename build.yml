name: Build Nebula Pad (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NebulaPad-Windows
          path: |
            build/NebulaPad_artefacts/Release/VST3/
            build/NebulaPad_artefacts/Release/Standalone/
